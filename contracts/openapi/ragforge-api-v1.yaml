{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "RAGForge API",
    "version": "1.0.0",
    "description": "Phase 1 public REST contract. The operations are planned contracts; they do not claim that a server implementation is available.",
    "license": {
      "name": "Proprietary project contract"
    }
  },
  "x-ragforge-contract-status": "planned",
  "servers": [
    {
      "url": "/",
      "description": "The deployment prefixes this contract with the configured origin. API paths include /api/v1."
    }
  ],
  "tags": [
    {
      "name": "auth"
    },
    {
      "name": "sessions"
    },
    {
      "name": "spaces"
    }
  ],
  "paths": {
    "/api/v1/auth/register": {
      "post": {
        "tags": ["auth"],
        "operationId": "registerUser",
        "summary": "Register a local account",
        "description": "Creates an account. The response never returns the password or a password-derived secret.",
        "security": [],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/RegisterRequest"}
            }
          }
        },
        "responses": {
          "201": {
            "description": "Account created",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RegisterResponse"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "422": {"$ref": "#/components/responses/UnprocessableEntity"},
          "429": {"$ref": "#/components/responses/TooManyRequests"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/auth/login": {
      "post": {
        "tags": ["auth"],
        "operationId": "loginUser",
        "summary": "Create a session for a local account",
        "description": "Login creates a server-side session. The browser receives an HttpOnly session cookie; the response contains only a CSRF token for subsequent state changes.",
        "security": [],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/LoginRequest"}
            }
          }
        },
        "responses": {
          "201": {
            "description": "Session created",
            "headers": {
              "Set-Cookie": {"$ref": "#/components/headers/SessionCookie"},
              "X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}
            },
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginResponse"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "429": {"$ref": "#/components/responses/TooManyRequests"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/sessions": {
      "post": {
        "tags": ["sessions"],
        "operationId": "createSession",
        "summary": "Create a server-side session",
        "description": "Canonical session creation operation for clients that do not use the auth facade path.",
        "security": [],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/LoginRequest"}
            }
          }
        },
        "responses": {
          "201": {
            "description": "Session created",
            "headers": {
              "Set-Cookie": {"$ref": "#/components/headers/SessionCookie"},
              "X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}
            },
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginResponse"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "429": {"$ref": "#/components/responses/TooManyRequests"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/sessions/current": {
      "get": {
        "tags": ["sessions"],
        "operationId": "getCurrentSession",
        "summary": "Get the current session",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"}
        ],
        "responses": {
          "200": {
            "description": "Current session",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CurrentSession"}}}
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      },
      "delete": {
        "tags": ["sessions"],
        "operationId": "deleteCurrentSession",
        "summary": "Revoke the current session",
        "security": [{"cookieAuth": []}],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/CsrfToken"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "responses": {
          "204": {
            "description": "Session revoked",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}}
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/spaces": {
      "get": {
        "tags": ["spaces"],
        "operationId": "listSpaces",
        "summary": "List spaces visible to the authenticated principal",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/Cursor"},
          {"$ref": "#/components/parameters/Limit"}
        ],
        "responses": {
          "200": {
            "description": "Visible spaces",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SpacePage"}}}
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      },
      "post": {
        "tags": ["spaces"],
        "operationId": "createSpace",
        "summary": "Create a knowledge space",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/CsrfToken"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/CreateSpaceRequest"}
            }
          }
        },
        "responses": {
          "201": {
            "description": "Space created",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Space"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "422": {"$ref": "#/components/responses/UnprocessableEntity"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/spaces/{spaceId}/members/{userId}": {
      "parameters": [
        {"$ref": "#/components/parameters/SpaceId"},
        {"$ref": "#/components/parameters/UserId"}
      ],
      "put": {
        "tags": ["spaces"],
        "operationId": "upsertSpaceMember",
        "summary": "Add or change a space member role",
        "description": "The authenticated principal and the target resource must resolve to the same space. The server must not trust a frontend-only filter.",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/CsrfToken"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/UpdateSpaceMemberRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Member role updated",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SpaceMember"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "412": {"$ref": "#/components/responses/PreconditionFailed"},
          "422": {"$ref": "#/components/responses/UnprocessableEntity"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "RAGFORGE_SESSION",
        "description": "Opaque server-side session cookie. It is HttpOnly, Secure outside local development, and SameSite.",
        "x-ragforge-no-jwt": true
      },
      "serviceToken": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "service-token",
        "description": "Short-lived, scoped and revocable service token. Tokens are stored as hashes and never logged."
      }
    },
    "parameters": {
      "CorrelationId": {
        "name": "X-Correlation-Id",
        "in": "header",
        "required": false,
        "description": "Client-supplied UUIDv7 for tracing. The server generates one when absent and echoes the effective value.",
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "CsrfToken": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "description": "Required for browser state-changing requests; obtain it from the current session response or a CSRF bootstrap flow.",
        "schema": {"type": "string", "minLength": 32, "maxLength": 256, "pattern": "^[A-Za-z0-9._~-]+$"}
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Stable key for a retried write. The server binds the key to the request hash and refuses a conflicting reuse.",
        "schema": {"type": "string", "minLength": 1, "maxLength": 255, "pattern": "^[A-Za-z0-9._~-]+$"}
      },
      "SpaceId": {
        "name": "spaceId",
        "in": "path",
        "required": true,
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "UserId": {
        "name": "userId",
        "in": "path",
        "required": true,
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "description": "Opaque forward cursor. Clients must not decode or construct it.",
        "schema": {"type": "string", "minLength": 1, "maxLength": 512, "pattern": "^[A-Za-z0-9._~-]+$"}
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {"type": "integer", "format": "int32", "minimum": 1, "maximum": 100, "default": 20}
      }
    },
    "headers": {
      "CorrelationId": {
        "description": "Effective request correlation ID.",
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "SessionCookie": {
        "description": "Opaque HttpOnly/Secure/SameSite session cookie; the value is intentionally not represented in the JSON response.",
        "schema": {"type": "string"}
      }
    },
    "schemas": {
      "UuidV7": {
        "type": "string",
        "format": "uuidv7",
        "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
        "description": "RFC 9562 UUID version 7 with the RFC variant bits."
      },
      "User": {
        "type": "object",
        "additionalProperties": false,
        "required": ["userId", "email", "displayName", "platformRole"],
        "properties": {
          "userId": {"$ref": "#/components/schemas/UuidV7"},
          "email": {"type": "string", "format": "idn-email", "maxLength": 320},
          "displayName": {"type": "string", "minLength": 1, "maxLength": 120},
          "platformRole": {"type": "string", "enum": ["PLATFORM_ADMIN", "USER"]}
        }
      },
      "RegisterRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["email", "password", "displayName"],
        "properties": {
          "email": {"type": "string", "format": "idn-email", "maxLength": 320},
          "password": {"type": "string", "format": "password", "minLength": 12, "maxLength": 256, "writeOnly": true},
          "displayName": {"type": "string", "minLength": 1, "maxLength": 120}
        }
      },
      "LoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["email", "password"],
        "properties": {
          "email": {"type": "string", "format": "idn-email", "maxLength": 320},
          "password": {"type": "string", "format": "password", "minLength": 1, "maxLength": 256, "writeOnly": true}
        }
      },
      "Session": {
        "type": "object",
        "additionalProperties": false,
        "required": ["sessionId", "userId", "expiresAt", "csrfToken"],
        "properties": {
          "sessionId": {"$ref": "#/components/schemas/UuidV7"},
          "userId": {"$ref": "#/components/schemas/UuidV7"},
          "expiresAt": {"type": "string", "format": "date-time"},
          "csrfToken": {"type": "string", "minLength": 32, "maxLength": 256, "readOnly": true}
        }
      },
      "RegisterResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["user"],
        "properties": {"user": {"$ref": "#/components/schemas/User"}}
      },
      "LoginResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["session", "user"],
        "properties": {
          "session": {"$ref": "#/components/schemas/Session"},
          "user": {"$ref": "#/components/schemas/User"}
        }
      },
      "CurrentSession": {
        "type": "object",
        "additionalProperties": false,
        "required": ["session", "user"],
        "properties": {
          "session": {"$ref": "#/components/schemas/Session"},
          "user": {"$ref": "#/components/schemas/User"}
        }
      },
      "CreateSpaceRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["name"],
        "properties": {
          "name": {"type": "string", "minLength": 1, "maxLength": 120},
          "description": {"type": "string", "maxLength": 2000}
        }
      },
      "Space": {
        "type": "object",
        "additionalProperties": false,
        "required": ["spaceId", "name", "status", "role", "createdAt"],
        "properties": {
          "spaceId": {"$ref": "#/components/schemas/UuidV7"},
          "name": {"type": "string", "minLength": 1, "maxLength": 120},
          "description": {"type": "string", "maxLength": 2000},
          "status": {"type": "string", "enum": ["ACTIVE", "ARCHIVED"]},
          "role": {"$ref": "#/components/schemas/MemberRole"},
          "createdAt": {"type": "string", "format": "date-time"},
          "version": {"type": "integer", "minimum": 0}
        }
      },
      "SpacePage": {
        "type": "object",
        "additionalProperties": false,
        "required": ["items", "nextCursor"],
        "properties": {
          "items": {"type": "array", "items": {"$ref": "#/components/schemas/Space"}},
          "nextCursor": {"type": ["string", "null"], "minLength": 1, "maxLength": 512, "pattern": "^[A-Za-z0-9._~-]+$"}
        }
      },
      "MemberRole": {
        "type": "string",
        "enum": ["SPACE_ADMIN", "EDITOR", "VIEWER"]
      },
      "UpdateSpaceMemberRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["role"],
        "properties": {
          "role": {"$ref": "#/components/schemas/MemberRole"},
          "version": {"type": "integer", "minimum": 0}
        }
      },
      "SpaceMember": {
        "type": "object",
        "additionalProperties": false,
        "required": ["spaceId", "userId", "role", "version"],
        "properties": {
          "spaceId": {"$ref": "#/components/schemas/UuidV7"},
          "userId": {"$ref": "#/components/schemas/UuidV7"},
          "role": {"$ref": "#/components/schemas/MemberRole"},
          "version": {"type": "integer", "minimum": 0}
        }
      },
      "FieldError": {
        "type": "object",
        "additionalProperties": false,
        "required": ["field", "code", "message"],
        "properties": {
          "field": {"type": "string", "minLength": 1, "maxLength": 200},
          "code": {"type": "string", "pattern": "^[A-Z][A-Z0-9_]{1,63}$"},
          "message": {"type": "string", "minLength": 1, "maxLength": 500}
        }
      },
      "ProblemDetails": {
        "type": "object",
        "additionalProperties": true,
        "required": ["type", "title", "status", "detail", "instance", "code", "correlationId"],
        "properties": {
          "type": {"type": "string", "format": "uri-reference"},
          "title": {"type": "string", "minLength": 1},
          "status": {"type": "integer", "minimum": 400, "maximum": 599},
          "detail": {"type": "string", "minLength": 1, "maxLength": 2000},
          "instance": {"type": "string", "format": "uri-reference"},
          "code": {"type": "string", "pattern": "^[A-Z][A-Z0-9_]{1,63}$"},
          "correlationId": {"$ref": "#/components/schemas/UuidV7"},
          "fieldErrors": {"type": "array", "maxItems": 50, "items": {"$ref": "#/components/schemas/FieldError"}}
        },
        "example": {
          "type": "https://errors.ragforge.local/problems/space-access-denied",
          "title": "Space access denied",
          "status": 403,
          "detail": "The principal is not a member of this space.",
          "instance": "/api/v1/spaces/0190f5c2-7c1e-7abc-8def-1234567890ab",
          "code": "SPACE_ACCESS_DENIED",
          "correlationId": "0190f5c2-7c1e-7abc-8def-1234567890ab"
        }
      }
    },
    "responses": {
      "BadRequest": {"description": "Malformed request", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}},
      "Unauthorized": {"description": "Authentication required or credentials invalid", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}},
      "Forbidden": {"description": "Permission or CSRF check failed", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}},
      "NotFound": {"description": "Resource not found in the authorized space", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}},
      "Conflict": {"description": "Duplicate or idempotency/request-hash conflict", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}},
      "PreconditionFailed": {"description": "Optimistic version precondition failed", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}},
      "UnprocessableEntity": {"description": "Request failed field validation", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}},
      "TooManyRequests": {"description": "Rate limit exceeded", "headers": {"Retry-After": {"schema": {"type": "integer", "minimum": 1}}}, "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}},
      "InternalError": {"description": "Unexpected server error", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}
    }
  }
}
