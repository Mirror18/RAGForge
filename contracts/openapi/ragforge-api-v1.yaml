      }
    },
    "/api/v1/spaces/{spaceId}/model-routes": {
      "x-ragforge-implementation-status": "phase2-contract",
      "parameters": [{"$ref": "#/components/parameters/SpaceId"}],
      "get": {
        "tags": ["providers"], "operationId": "listModelRoutes", "summary": "List versioned model routes", "security": [{"cookieAuth": []}, {"serviceToken": []}],
