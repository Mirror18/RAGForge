        "responses": {"200": {"description": "Space binding", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SpaceBinding"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalError"}}
