        "responses": {"201": {"description": "Model profile created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ModelProfile"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/UnprocessableEntity"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/InternalError"}}
      }
    },
    "/api/v1/spaces/{spaceId}/model-routes": {
      "x-ragforge-implementation-status": "phase2-contract",
      "parameters": [{"$ref": "#/components/parameters/SpaceId"}],
      "get": {
        "tags": ["providers"], "operationId": "listModelRoutes", "summary": "List versioned model routes", "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [{"$ref": "#/components/parameters/CorrelationId"}, {"$ref": "#/components/parameters/Cursor"}, {"$ref": "#/components/parameters/Limit"}],
        "responses": {"200": {"description": "Model routes", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ModelRoutePage"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "500": {"$ref": "#/components/responses/InternalError"}}
      },
      "post": {
        "tags": ["providers"], "operationId": "createModelRoute", "summary": "Create a versioned model route", "description": "Failover is explicit and limited to candidates with the same egress class; local failure never silently selects a cloud candidate.", "security": [{"cookieAuth": []}, {"serviceToken": []}],
