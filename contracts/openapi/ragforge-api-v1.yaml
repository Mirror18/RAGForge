{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "RAGForge API",
    "version": "1.0.0",
    "description": "Phase 1, Phase 2 and Phase 3 public REST/SSE contract plus frozen Phase 4-G Chunk Studio and Retrieval Playground projections. Phase 1-3 operations retain their planned/contract status; Phase 4-G is a frozen implementation contract and does not claim that the whole API is implemented.",
    "license": {
      "name": "Proprietary project contract"
    }
  },
  "x-ragforge-contract-status": "planned",
  "x-ragforge-phase2-status": "phase2-contract",
  "x-ragforge-phase3-status": "phase3-contract",
  "x-ragforge-phase4-status": "phase4-contract",
  "servers": [
    {
      "url": "/",
      "description": "The deployment prefixes this contract with the configured origin. API paths include /api/v1."
    }
  ],
  "tags": [
    {
      "name": "auth"
    },
    {
      "name": "sessions"
    },
    {
      "name": "spaces"
    },
    {
      "name": "providers"
    },
    {
      "name": "prompts"
    },
    {
      "name": "runs"
    },
    {
      "name": "answers"
    },
    {
      "name": "sources"
    },
    {
      "name": "ingestion"
    },
    {
      "name": "chunk-studio"
    },
    {
      "name": "retrieval-playground"
    }
  ],
  "paths": {
    "/api/v1/auth/register": {
      "post": {
        "tags": ["auth"],
        "operationId": "registerUser",
        "summary": "Register a local account",
        "description": "Creates an account. The response never returns the password or a password-derived secret.",
        "security": [],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/RegisterRequest"}
            }
          }
        },
        "responses": {
          "201": {
            "description": "Account created",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RegisterResponse"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "422": {"$ref": "#/components/responses/UnprocessableEntity"},
          "429": {"$ref": "#/components/responses/TooManyRequests"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/auth/login": {
      "post": {
        "tags": ["auth"],
        "operationId": "loginUser",
        "summary": "Create a session for a local account",
        "description": "Login creates a server-side session. The browser receives an HttpOnly session cookie; the response contains only a CSRF token for subsequent state changes.",
        "security": [],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/LoginRequest"}
            }
          }
        },
        "responses": {
          "201": {
            "description": "Session created",
            "headers": {
              "Set-Cookie": {"$ref": "#/components/headers/SessionCookie"},
              "X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}
            },
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginResponse"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "429": {"$ref": "#/components/responses/TooManyRequests"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/sessions": {
      "post": {
        "tags": ["sessions"],
        "operationId": "createSession",
        "summary": "Create a server-side session",
        "description": "Canonical session creation operation for clients that do not use the auth facade path.",
        "security": [],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/LoginRequest"}
            }
          }
        },
        "responses": {
          "201": {
            "description": "Session created",
            "headers": {
              "Set-Cookie": {"$ref": "#/components/headers/SessionCookie"},
              "X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}
            },
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginResponse"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "429": {"$ref": "#/components/responses/TooManyRequests"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/sessions/current": {
      "get": {
        "tags": ["sessions"],
        "operationId": "getCurrentSession",
        "summary": "Get the current session",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"}
        ],
        "responses": {
          "200": {
            "description": "Current session",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CurrentSession"}}}
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      },
      "delete": {
        "tags": ["sessions"],
        "operationId": "deleteCurrentSession",
        "summary": "Revoke the current session",
        "security": [{"cookieAuth": []}],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/CsrfToken"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "responses": {
          "204": {
            "description": "Session revoked",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}}
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/spaces": {
      "get": {
        "tags": ["spaces"],
        "operationId": "listSpaces",
        "summary": "List spaces visible to the authenticated principal",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/Cursor"},
          {"$ref": "#/components/parameters/Limit"}
        ],
        "responses": {
          "200": {
            "description": "Visible spaces",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SpacePage"}}}
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      },
      "post": {
        "tags": ["spaces"],
        "operationId": "createSpace",
        "summary": "Create a knowledge space",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/CsrfToken"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/CreateSpaceRequest"}
            }
          }
        },
        "responses": {
          "201": {
            "description": "Space created",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Space"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "422": {"$ref": "#/components/responses/UnprocessableEntity"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/spaces/{spaceId}/members/{userId}": {
      "parameters": [
        {"$ref": "#/components/parameters/SpaceId"},
        {"$ref": "#/components/parameters/UserId"}
      ],
      "put": {
        "tags": ["spaces"],
        "operationId": "upsertSpaceMember",
        "summary": "Add or change a space member role",
        "description": "The authenticated principal and the target resource must resolve to the same space. The server must not trust a frontend-only filter.",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [
          {"$ref": "#/components/parameters/CorrelationId"},
          {"$ref": "#/components/parameters/CsrfToken"},
          {"$ref": "#/components/parameters/IdempotencyKey"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/UpdateSpaceMemberRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "Member role updated",
            "headers": {"X-Correlation-Id": {"$ref": "#/components/headers/CorrelationId"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SpaceMember"}}}
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "412": {"$ref": "#/components/responses/PreconditionFailed"},
          "422": {"$ref": "#/components/responses/UnprocessableEntity"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/spaces/{spaceId}/provider-connections": {
      "x-ragforge-implementation-status": "phase2-contract",
      "parameters": [{"$ref": "#/components/parameters/SpaceId"}],
      "get": {
        "tags": ["providers"],
        "operationId": "listProviderConnections",
        "summary": "List versioned provider connections in a space",
        "description": "Contract only. Credentials are represented by an opaque credentialRef and are never returned.",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [{"$ref": "#/components/parameters/CorrelationId"}, {"$ref": "#/components/parameters/Cursor"}, {"$ref": "#/components/parameters/Limit"}],
        "responses": {
          "200": {"description": "Provider connections", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProviderConnectionPage"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      },
      "post": {
        "tags": ["providers"],
        "operationId": "createProviderConnection",
        "summary": "Create a versioned provider connection",
        "description": "Contract only. A cloud connection is not callable until a space binding explicitly authorizes cloud egress.",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [{"$ref": "#/components/parameters/CorrelationId"}, {"$ref": "#/components/parameters/CsrfToken"}, {"$ref": "#/components/parameters/IdempotencyKey"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProviderConnectionRequest"}}}},
        "responses": {
          "201": {"description": "Provider connection created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProviderConnection"}}}},
          "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/UnprocessableEntity"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/api/v1/spaces/{spaceId}/provider-connections/{providerConnectionId}": {
      "x-ragforge-implementation-status": "phase2-contract",
      "parameters": [{"$ref": "#/components/parameters/SpaceId"}, {"$ref": "#/components/parameters/ProviderConnectionId"}],
      "get": {
        "tags": ["providers"], "operationId": "getProviderConnection", "summary": "Get a versioned provider connection", "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [{"$ref": "#/components/parameters/CorrelationId"}],
        "responses": {"200": {"description": "Provider connection", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProviderConnection"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalError"}}
      },
      "put": {
        "tags": ["providers"], "operationId": "updateProviderConnection", "summary": "Create the next provider connection version", "description": "Published versions are immutable; updates create a new version and require an optimistic version precondition.", "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [{"$ref": "#/components/parameters/CorrelationId"}, {"$ref": "#/components/parameters/CsrfToken"}, {"$ref": "#/components/parameters/IdempotencyKey"}, {"$ref": "#/components/parameters/IfMatch"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProviderConnectionUpdateRequest"}}}},
        "responses": {"200": {"description": "Provider connection version created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProviderConnection"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "412": {"$ref": "#/components/responses/PreconditionFailed"}, "422": {"$ref": "#/components/responses/UnprocessableEntity"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/InternalError"}}
      }
    },
    "/api/v1/spaces/{spaceId}/provider-connections/{providerConnectionId}/test": {
      "x-ragforge-implementation-status": "phase2-contract",
      "parameters": [{"$ref": "#/components/parameters/SpaceId"}, {"$ref": "#/components/parameters/ProviderConnectionId"}],
      "post": {
        "tags": ["providers"], "operationId": "testProviderConnection", "summary": "Run a deterministic provider connection test", "description": "Contract only. The test uses bounded, redacted fixtures and never returns credentials or full prompts.", "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [{"$ref": "#/components/parameters/CorrelationId"}, {"$ref": "#/components/parameters/CsrfToken"}, {"$ref": "#/components/parameters/IdempotencyKey"}],
        "requestBody": {"required": false, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProviderConnectionTestRequest"}}}},
        "responses": {"202": {"description": "Connection test accepted; result is observable through the correlation ID"}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/InternalError"}}
      }
    },
    "/api/v1/spaces/{spaceId}/model-profiles": {
      "x-ragforge-implementation-status": "phase2-contract",
      "parameters": [{"$ref": "#/components/parameters/SpaceId"}],
      "get": {
        "tags": ["providers"], "operationId": "listModelProfiles", "summary": "List versioned model profiles", "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [{"$ref": "#/components/parameters/CorrelationId"}, {"$ref": "#/components/parameters/Cursor"}, {"$ref": "#/components/parameters/Limit"}],
        "responses": {"200": {"description": "Model profiles", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ModelProfilePage"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "500": {"$ref": "#/components/responses/InternalError"}}
      },
      "post": {
        "tags": ["providers"], "operationId": "createModelProfile", "summary": "Create a versioned model profile", "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [{"$ref": "#/components/parameters/CorrelationId"}, {"$ref": "#/components/parameters/CsrfToken"}, {"$ref": "#/components/parameters/IdempotencyKey"}],
