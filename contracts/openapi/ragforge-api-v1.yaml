        "responses": {"200": {"description": "Prompt templates", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PromptTemplatePage"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "500": {"$ref": "#/components/responses/InternalError"}}
      },
      "post": {
        "tags": ["prompts"], "operationId": "createPromptTemplate", "summary": "Create a prompt template", "security": [{"cookieAuth": []}, {"serviceToken": []}],
        "parameters": [{"$ref": "#/components/parameters/CorrelationId"}, {"$ref": "#/components/parameters/CsrfToken"}, {"$ref": "#/components/parameters/IdempotencyKey"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PromptTemplateRequest"}}}},
        "responses": {"201": {"description": "Prompt template created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PromptTemplate"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/UnprocessableEntity"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/InternalError"}}
      }
    },
