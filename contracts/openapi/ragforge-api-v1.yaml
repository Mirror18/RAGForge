  "components": {
    "securitySchemes": {
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "RAGFORGE_SESSION",
        "description": "Opaque server-side session cookie. It is HttpOnly, Secure outside local development, and SameSite.",
        "x-ragforge-no-jwt": true
      },
      "serviceToken": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "service-token",
        "description": "Short-lived, scoped and revocable service token. Tokens are stored as hashes and never logged."
      }
    },
    "parameters": {
      "CorrelationId": {
        "name": "X-Correlation-Id",
        "in": "header",
        "required": false,
        "description": "Client-supplied UUIDv7 for tracing. The server generates one when absent and echoes the effective value.",
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "CsrfToken": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "description": "Required for browser state-changing requests; obtain it from the current session response or a CSRF bootstrap flow.",
        "schema": {"type": "string", "minLength": 32, "maxLength": 256, "pattern": "^[A-Za-z0-9._~-]+$"}
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Stable key for a retried write. The server binds the key to the request hash and refuses a conflicting reuse.",
        "schema": {"type": "string", "minLength": 1, "maxLength": 255, "pattern": "^[A-Za-z0-9._~-]+$"}
      },
      "SpaceId": {
        "name": "spaceId",
        "in": "path",
        "required": true,
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "UserId": {
        "name": "userId",
        "in": "path",
        "required": true,
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "ProviderConnectionId": {
        "name": "providerConnectionId",
        "in": "path",
        "required": true,
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "PromptTemplateId": {
        "name": "promptTemplateId",
        "in": "path",
        "required": true,
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "PromptVersion": {
        "name": "promptVersion",
        "in": "path",
        "required": true,
        "schema": {"type": "integer", "minimum": 1}
      },
      "ConversationId": {
        "name": "conversationId",
        "in": "path",
        "required": true,
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "RunId": {
        "name": "runId",
        "in": "path",
        "required": true,
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "IfMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "description": "Opaque version or ETag precondition for a versioned resource.",
        "schema": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9._:\"-]+$"}
      },
      "LastEventId": {
        "name": "Last-Event-ID",
        "in": "header",
        "required": false,
        "description": "The last SSE event ID received by the client. The server replays events after this ID or sends a fresh snapshot when it is outside the retention window.",
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "Snapshot": {
        "name": "snapshot",
        "in": "query",
        "required": false,
        "description": "Request an initial or recovery snapshot before live events.",
        "schema": {"type": "boolean", "default": true}
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "description": "Opaque forward cursor. Clients must not decode or construct it.",
        "schema": {"type": "string", "minLength": 1, "maxLength": 512, "pattern": "^[A-Za-z0-9._~-]+$"}
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {"type": "integer", "format": "int32", "minimum": 1, "maximum": 100, "default": 20}
      }
    },
    "headers": {
      "CorrelationId": {
        "description": "Effective request correlation ID.",
        "schema": {"$ref": "#/components/schemas/UuidV7"}
      },
      "SessionCookie": {
        "description": "Opaque HttpOnly/Secure/SameSite session cookie; the value is intentionally not represented in the JSON response.",
        "schema": {"type": "string"}
      }
    },
    "schemas": {
      "UuidV7": {
        "type": "string",
        "format": "uuidv7",
        "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
        "description": "RFC 9562 UUID version 7 with the RFC variant bits."
      },
      "User": {
        "type": "object",
        "additionalProperties": false,
        "required": ["userId", "email", "displayName", "platformRole"],
        "properties": {
          "userId": {"$ref": "#/components/schemas/UuidV7"},
          "email": {"type": "string", "format": "idn-email", "maxLength": 320},
          "displayName": {"type": "string", "minLength": 1, "maxLength": 120},
          "platformRole": {"type": "string", "enum": ["PLATFORM_ADMIN", "USER"]}
        }
      },
      "RegisterRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["email", "password", "displayName"],
        "properties": {
          "email": {"type": "string", "format": "idn-email", "maxLength": 320},
          "password": {"type": "string", "format": "password", "minLength": 12, "maxLength": 256, "writeOnly": true},
          "displayName": {"type": "string", "minLength": 1, "maxLength": 120}
        }
      },
      "LoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["email", "password"],
        "properties": {
          "email": {"type": "string", "format": "idn-email", "maxLength": 320},
          "password": {"type": "string", "format": "password", "minLength": 1, "maxLength": 256, "writeOnly": true}
        }
      },
      "Session": {
        "type": "object",
        "additionalProperties": false,
        "required": ["sessionId", "userId", "expiresAt", "csrfToken"],
        "properties": {
          "sessionId": {"$ref": "#/components/schemas/UuidV7"},
          "userId": {"$ref": "#/components/schemas/UuidV7"},
          "expiresAt": {"type": "string", "format": "date-time"},
          "csrfToken": {"type": "string", "minLength": 32, "maxLength": 256, "readOnly": true}
        }
      },
      "RegisterResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["user"],
        "properties": {"user": {"$ref": "#/components/schemas/User"}}
      },
      "LoginResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["session", "user"],
        "properties": {
          "session": {"$ref": "#/components/schemas/Session"},
          "user": {"$ref": "#/components/schemas/User"}
        }
      },
      "CurrentSession": {
        "type": "object",
        "additionalProperties": false,
        "required": ["session", "user"],
        "properties": {
          "session": {"$ref": "#/components/schemas/Session"},
          "user": {"$ref": "#/components/schemas/User"}
        }
      },
      "CreateSpaceRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["name"],
        "properties": {
          "name": {"type": "string", "minLength": 1, "maxLength": 120},
          "description": {"type": "string", "maxLength": 2000}
        }
      },
      "Space": {
        "type": "object",
        "additionalProperties": false,
        "required": ["spaceId", "name", "status", "role", "createdAt"],
        "properties": {
          "spaceId": {"$ref": "#/components/schemas/UuidV7"},
          "name": {"type": "string", "minLength": 1, "maxLength": 120},
          "description": {"type": "string", "maxLength": 2000},
          "status": {"type": "string", "enum": ["ACTIVE", "ARCHIVED"]},
          "role": {"$ref": "#/components/schemas/MemberRole"},
          "createdAt": {"type": "string", "format": "date-time"},
          "version": {"type": "integer", "minimum": 0}
        }
      },
      "SpacePage": {
        "type": "object",
        "additionalProperties": false,
        "required": ["items", "nextCursor"],
        "properties": {
          "items": {"type": "array", "items": {"$ref": "#/components/schemas/Space"}},
          "nextCursor": {"type": ["string", "null"], "minLength": 1, "maxLength": 512, "pattern": "^[A-Za-z0-9._~-]+$"}
        }
      },
      "MemberRole": {
        "type": "string",
        "enum": ["SPACE_ADMIN", "EDITOR", "VIEWER"]
      },
      "UpdateSpaceMemberRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["role"],
        "properties": {
          "role": {"$ref": "#/components/schemas/MemberRole"},
          "version": {"type": "integer", "minimum": 0}
        }
      },
      "SpaceMember": {
        "type": "object",
        "additionalProperties": false,
        "required": ["spaceId", "userId", "role", "version"],
        "properties": {
          "spaceId": {"$ref": "#/components/schemas/UuidV7"},
          "userId": {"$ref": "#/components/schemas/UuidV7"},
          "role": {"$ref": "#/components/schemas/MemberRole"},
          "version": {"type": "integer", "minimum": 0}
        }
      },
      "ProviderType": {"type": "string", "enum": ["OLLAMA", "OPENAI_COMPATIBLE", "AI_RUNTIME"]},
      "EgressClass": {"type": "string", "enum": ["LOCAL", "CLOUD"]},
      "ProviderConnectionStatus": {"type": "string", "enum": ["DRAFT", "ACTIVE", "DISABLED"]},
      "ModelPurpose": {"type": "string", "enum": ["CHAT", "EMBEDDING", "RERANK"]},
      "ModelCapability": {"type": "string", "enum": ["CHAT", "EMBEDDING", "RERANK", "STREAMING", "TOOLS", "JSON_SCHEMA", "VISION", "USAGE_REPORTING", "CUSTOM_HEADERS"]},
      "UsageSource": {"type": "string", "enum": ["PROVIDER_REPORTED", "LOCAL_ESTIMATE"]},
      "RunStatus": {"type": "string", "enum": ["QUEUED", "RUNNING", "SUCCEEDED", "FAILED", "CANCELLED"]},
      "StepStatus": {"type": "string", "enum": ["QUEUED", "RUNNING", "SUCCEEDED", "FAILED", "CANCELLED"]},
      "StepType": {"type": "string", "enum": ["REWRITE", "RETRIEVE", "RERANK", "TOOL", "GENERATE"]},
      "ErrorClass": {"type": "string", "enum": ["AUTHENTICATION", "RATE_LIMIT", "QUOTA", "MODEL_NOT_FOUND", "CONTEXT_OVERFLOW", "CONTENT_POLICY", "TIMEOUT", "UNAVAILABLE", "UNSUPPORTED_CAPABILITY", "INVALID_RESPONSE", "CANCELLED", "SPACE_EGRESS_DENIED", "IDEMPOTENCY_CONFLICT"]},
      "RetryPolicy": {
        "type": "object", "additionalProperties": false, "required": ["retryable", "maxAttempts", "backoffSeconds"],
        "properties": {"retryable": {"type": "boolean"}, "maxAttempts": {"type": "integer", "minimum": 1, "maximum": 5}, "backoffSeconds": {"type": "integer", "minimum": 0, "maximum": 3600}}
      },
      "ProviderConnectionRequest": {
        "type": "object", "additionalProperties": false, "required": ["providerType", "egressClass", "endpoint", "credentialRef", "status"],
        "properties": {
          "providerType": {"$ref": "#/components/schemas/ProviderType"},
          "egressClass": {"$ref": "#/components/schemas/EgressClass"},
          "endpoint": {"type": "string", "format": "uri", "minLength": 1, "maxLength": 2048},
          "credentialRef": {"type": "string", "minLength": 2, "maxLength": 128, "pattern": "^[a-z][a-z0-9._:-]{1,127}$", "description": "Opaque reference only; never an API key, password, token, or secret value."},
          "status": {"$ref": "#/components/schemas/ProviderConnectionStatus"}
        }
      },
      "ProviderConnectionUpdateRequest": {
        "allOf": [{"$ref": "#/components/schemas/ProviderConnectionRequest"}, {"type": "object", "required": ["version"], "properties": {"version": {"type": "integer", "minimum": 1}}}]
      },
      "ProviderConnection": {
