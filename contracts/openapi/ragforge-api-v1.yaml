      ],
      "post": {
        "tags": ["chunk-studio"],
        "operationId": "createChunkOverride",
        "summary": "Create a manual child chunk override",
        "description": "Creates an auditable manual override for the child chunk in the requested space and document revision. The repository owns the initial NONE semantics; the client cannot provide state, createdBy, timestamps or other audit identity. The service derives audit fields from the authenticated principal and never accepts fullText or rawText.",
        "security": [{"cookieAuth": []}, {"serviceToken": []}],
