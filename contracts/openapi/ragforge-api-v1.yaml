        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PromptVersionRequest"}}}},
        "responses": {"201": {"description": "Prompt version created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PromptVersion"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/UnprocessableEntity"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/InternalError"}}
      }
    },
