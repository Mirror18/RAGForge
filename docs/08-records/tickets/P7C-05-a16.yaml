acceptance:
  criteria:
    - id: A1
      text: apps/ai-runtime 提供本地、无云出境的 RERANK HTTP adapter seam；输入候选数量、文本与响应大小有界，协议返回可验证的 candidate identity、score、model/capability 元数据；只使用现有官方/标准库依赖，不接受新第三方许可证。
    - id: A2
      text: Server ProviderAdapter/Reranker 生产路径接入 AI_RUNTIME RERANK adapter；按 space_id 绑定的已发布 RERANK route 调用，未配置/未发布/超时/非法响应均 fail closed，不能静默退回 LexicalReranker，也不能把跨空间或全文文档发送给 runtime。
    - id: A3
      text: Provider connection test 对 RERANK 具备独立 success、failed、UNSUPPORTED_CAPABILITY 三条可观测路径；成功结果持久化 verified capability，Profile PUBLISHED 闸门对 RERANK 与 CHAT/EMBEDDING 一致生效。
    - id: A4
      text: 增加 RERANK loopback probe/adapter/retrieval 接线测试至少 4/4，覆盖真实返回、空间/候选边界、失败或非法响应、未支持能力；Provider/Model/Binding 既有回归保持通过，contract 52/52 通过。
    - id: A5
      text: 不新增数据库迁移、不启用云出境、不提交凭据；若实现确实需要 ownership 外文件、根依赖或高风险批准，立即停止并报告精确变更建议。

