acceptance:
  criteria:
    - id: A1
      text: 普通用户在不手填 UUID 的情况下完成来源提交、处理中轮询、终态展示，并能看到逐项任务状态与错误详情。
    - id: A2
      text: 来源/任务列表支持 cursor 分页与筛选，合成超过 100 个资源时无 slice(0,5) 或 limit=100 静默截断。
    - id: A3
      text: 失败任务支持重试/重放/重新同步，来源支持归档/删除；所有 mutation 复用 api.ts 的 CSRF、Idempotency-Key、If-Match 与 space_id 路径保护。
    - id: A4
      text: 轮询、分页、空态、错误态、权限拒绝均有可理解的中文反馈，刷新后保留当前来源/任务筛选与 cursor 状态。
    - id: A5
      text: Web format:check 与 build 通过；不得修改服务端、契约或 P7C-03 共享之外的文件。

