acceptance:
  criteria:
    - id: A1
      text: 基于 P7D-02 的三项目标镜像报告重新扫描并建立 CVE/package/severity/fix-version 清单；所有 Critical/High 均有修复结果或明确标注为不可修复并上报，不得静默忽略。
    - id: A2
      text: 在本卡 ownership 内升级存在修复版本的 Java 直接/传递依赖与 Dockerfile/Compose 基础镜像 digest；保持 Java 21、Web 构建和运行时兼容，不引入未登记的第三方源码或未审查依赖。
    - id: A3
      text: server、worker、web 目标镜像均以 immutable reference 生成 SBOM，并以 `grype --fail-on high` 扫描通过；不得降低阈值、添加无 owner/期限/补偿控制的 ignore 或 continue-on-error。
    - id: A4
      text: P7D-02 的 Compose/镜像 Secret 审计继续通过；Maven Server/Worker、Web typecheck/build、供应链单测、format、tracked-file secret gates 全部通过。
    - id: A5
      text: 仅使用合成/本地凭据和公共 registry；不执行生产迁移、不创建 release、不推送生产镜像、不启用云出境；若仍有不可修复 Critical/High，状态必须 BLOCKED 并给出精确的外部修复依赖。

