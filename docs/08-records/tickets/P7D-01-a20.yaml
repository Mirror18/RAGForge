acceptance:
  criteria:
    - id: A1
      text: web、server、worker 运行身份均为非 root；web 以非特权端口运行并保持 Compose 对外端口语义可用。
    - id: A2
      text: 三类应用均启用 cap_drop ALL、no-new-privileges、read_only 文件系统，并只通过明确的 tmpfs/受控目录获得必要写权限。
    - id: A3
      text: server 与 worker 均有可验证的 Compose healthcheck/readiness；web healthcheck 继续可用；依赖条件不把未 ready 服务当作 healthy。
    - id: A4
      text: 三类应用配置 CPU、内存、进程数上限，stop_grace_period 优雅关闭，以及 json-file 日志 max-size/max-file 轮转。
    - id: A5
      text: 本地 Docker Compose profile app 构建并启动成功；docker inspect 验证身份、安全选项、只读文件系统、资源/日志配置，healthcheck 达到 healthy；证据写入指定 JSON。
    - id: A6
      text: container hardening 检查脚本有单元测试，失败时 fail closed；不触碰生产数据、secret、迁移或云出境配置。

budget:
  token_limit: 8000

tests:
  must_run:
    - name: compose validation
      command: python scripts/ci/validate_compose.py
      expected: exit 0
    - name: container hardening unit tests
      command: python -m pytest -q tests/ci/test_container_hardening_check.py
      expected: all passed
    - name: compose hardening acceptance
      command: python scripts/ci/container_hardening_check.py --evidence tests/evidence/phase7-container-hardening.v1.json
      expected: exit 0 and evidence passed=true
    - name: compose app smoke
      command: docker compose -f deploy/compose/compose.yaml --profile app up -d --build
      expected: exit 0; app services healthy
  evidence_file: tests/evidence/P7D-01-worker-summary.v1.json
  evidence_schema:
    summary: {total: 0, passed: 0, failed: 0, failed_cases: [], duration_ms: 0}
    raw_output_stored: true

