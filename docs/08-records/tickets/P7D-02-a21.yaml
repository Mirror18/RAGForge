acceptance:
  criteria:
    - id: A1
      text: deploy/compose 中所有基础设施与应用镜像均使用 immutable digest；应用 Dockerfile 的基础镜像也锁定 digest，并保留可审计的镜像清单/说明。
    - id: A2
      text: CI 针对构建后的目标镜像（不是源码目录）生成镜像级 SBOM，并上传可下载的 CycloneDX 或等价 artifact；不得仅复用源码路径 SBOM 作为镜像证据。
    - id: A3
      text: CI 针对同一目标镜像执行 Grype 扫描并上传 SARIF/artifact；扫描目标、镜像 digest、失败策略和证据名称可追溯。
    - id: A4
      text: Secret 审计覆盖目标镜像及 Compose 展开配置；生产 Secret 不使用默认占位值、不进入镜像、展开配置或日志；审计成功返回 0，失败返回非 0。
    - id: A5
      text: Compose 静态验证、现有容器加固回归、format/secret gate 与供应链自测全部通过；只使用合成/本地凭据，不创建 release、不推送生产镜像、不执行生产迁移、不启用云出境。

