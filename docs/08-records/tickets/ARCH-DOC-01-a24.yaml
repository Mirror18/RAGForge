research_packet:
  observed_at: '2026-09-05'
  method: 官方web页面实读；GitHub API受403限流，SHA通过git ls-remote HEAD只读获取；不宣称最新release或固定SHA全文审计。
  sources:
    - project: RAGFlow
      repo: https://github.com/infiniflow/ragflow
      observed_head: 0c28d59ea1d362d9b6aa7481eed48c7fd9a95f0b
      url: https://github.com/infiniflow/ragflow/blob/main/docs/guides/dataset/configure_knowledge_base.md
      facts: 文档说明分块模板、解析结果可检查和干预、检索测试、摄取pipeline；仅借鉴可检查的中间产物和质量回路。该页面branch内容可变。
    - project: Dify
      repo: https://github.com/langgenius/dify
      observed_head: 00e578606715a9da34488608edee8c68d4ef4893
      url: https://docs.dify.ai/en/develop-plugin/dev-guides-and-walkthroughs/datasource-plugin
      facts: Datasource plugin是Knowledge Pipeline起点，manifest/provider/datasources职责分开；仅借鉴获取内容与处理内容边界。许可证沿用本仓UR-007的reference-only且拒绝代码复用结论。
    - project: Onyx
      repo: https://github.com/onyx-dot-app/onyx
      observed_head: 06aa2b09cc4aa5135fa2627e5235814e996f1514
      url: https://docs.onyx.app/admins/connectors/overview
      facts: 定期同步，refresh/prune和索引任务状态分离；权限同步明确为Enterprise Edition，不能当作MIT免费能力。仅借鉴同步生命周期，RAGForge继续space RBAC，不引入文档ACL。
    - project: Haystack
      repo: https://github.com/deepset-ai/haystack
      observed_head: 82da3adc2fac4675b80ff5573b790ec07113697b
      url: https://docs.haystack.deepset.ai/docs/pipelines
      facts: 文档实读页面显示3.1；组件构成有向多重图，支持分支、有限循环和异步并发；它是框架补充参考而非知识库产品，不引入Python业务后端或通用图引擎。
