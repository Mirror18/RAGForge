acceptance:
  criteria:
    A1: 对标RAGFlow、Dify、Onyx及补充框架Haystack；区分官方事实、项目推论、建议与未决项；引用具体页面、检索日期和可确认的SHA，不能把HEAD探测当作已读取全部代码。
    A2: 演进总文档含当前与目标差异表、Mermaid边界图、精确领域命名、数据和权限流、失败和恢复策略、分步迁移与回滚、可执行验收计划；保留单体加独立Worker和现有持久化BM25。
    A3: 提出受控阶段执行、版本化解析产物与发布门禁、统一检索执行快照；已存在的版本化摄取/混合检索/证据包不冒充新增。方案量级适合现项目且不声称性能已提升。
    A4: ADR-0013为Proposed且明确不能直接驱动实施；更新现有架构5份文档的短小提案章节及ADR索引，使读者可发现设计变化；现行基线与提案分开。
    A5: 明确space_id、云出境、结构化provenance、幂等/租约/重放/原子发布、线上离线同路径、历史引用与删除/撤权、兼容字段不等于已发布契约。
