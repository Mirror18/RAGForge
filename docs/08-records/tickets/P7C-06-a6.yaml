acceptance:
  criteria:
    - id: A1
      text: 普通用户无需手填 UUID，可从明确的新会话入口发起问答，并在刷新后恢复历史会话、历史回答与结构化 citations。
    - id: A2
      text: Citation preview 展示服务端返回的结构化 provenance 与受权预览状态，不丢弃响应；不得把自由文本或不受权正文伪装成 citation。
    - id: A3
      text: 提供反馈 API 与 UI，反馈按 space_id/run/evidence 绑定并保留幂等与权限边界。
    - id: A4
      text: 支持会话重命名、删除/归档，操作后历史列表和当前视图一致；跨空间访问被拒绝。
    - id: A5
      text: Streaming 文案使用规范的临时增量/最终答案描述；Web format:check/build、契约 52/52、服务端历史/反馈定向测试通过。

budget:
  token_limit: 9000

tests:
  must_run:
    - name: contract test
      command: python scripts/ci/contract_test.py
      expected: "52/52"
    - name: Answer/history/feedback server tests
      command: mvn -q -pl apps/server -am test -Dtest="AnswerApiControllerTest,RunExecutionControllerIntegrationTest,Phase5PersistenceIntegrationTest,*Feedback*"
      expected: BUILD SUCCESS with at least 3 new history/feedback tests
    - name: Web format check
      command: npm ci --prefix apps/web; npm --prefix apps/web run format:check
      expected: 0 errors
    - name: Web build
      command: npm --prefix apps/web run build
      expected: build success
  evidence_file: tests/evidence/P7C-06-worker-summary.v1.json
  evidence_schema:
