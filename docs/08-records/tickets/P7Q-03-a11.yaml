acceptance:
  criteria:
    - id: A1
      text: package.json 提供 test:unit（vitest run）与 test:e2e（playwright test）脚本，lockfile 与依赖可复现；不修改生产源码绕过真实行为
    - id: A2
      text: 以隔离 synthetic fixture 覆盖登录→首次设置、上传/轮询、索引发布、问答、取消、历史/归档、权限、跨空间拒绝共 8 条旅程
    - id: A3
      text: 测试断言结构化 API 请求的 space_id、权限拒绝、citation/provenance 与状态恢复，不把真实凭证、个人内容、raw prompt 或生产数据写入 fixture
    - id: A4
      text: Vitest 单测与 Playwright E2E 可在无外部服务环境下运行；必要的 mock/fixture 只在 tests 目录，失败信息带 journey 名称
    - id: A5
      text: 运行 test:unit、test:e2e、format:check、build、secret scan；生成 tests/evidence/phase7-web-e2e.v1.json，记录 8/8 结果与环境说明

