acceptance:
  criteria:
    - id: A1
      text: setup-java 从 v4 升级到官方 Node.js 24 兼容的 v5，并保留 Java 21 配置。
    - id: A2
      text: checkout、setup-python、cache、setup-node、upload-artifact、Anchore scan 等仍以 Node.js 20 为目标或已出现弃用告警的 Actions 升级到已验证的 Node.js 24 兼容版本；不得留下旧版本引用。
    - id: A3
      text: quality workflow 保留 fetch-depth 0，且显式设置 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true；不改变既有 job、权限、secret 或测试语义。
    - id: A4
      text: YAML 格式检查与 secret scan 通过；生成结构化 worker evidence，不包含完整长日志、凭据或个人数据。
    - id: A5
      text: 对每个变更动作记录版本选择依据；若某个动作无法确认 Node.js 24 兼容性，停止并报告，不以猜测替换。

budget:
  token_limit: 4000

tests:
  must_run:
    - name: workflow format check
      command: python scripts/ci/format_check.py
      expected: exit 0
    - name: secret scan
      command: python scripts/ci/secret_scan.py
      expected: exit 0
    - name: workflow action runtime audit
      command: python -c "from pathlib import Path; import re; p=Path('.github/workflows/quality.yml').read_text(encoding='utf-8'); assert 'FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true' in p; assert 'actions/setup-java@v5' in p; assert not re.search(r'actions/checkout@v4\\b|actions/setup-python@v5\\b|actions/cache@v4\\b|actions/setup-node@v4\\b|actions/upload-artifact@v4\\b', p); print('actions runtime audit passed')"
      expected: exit 0
