acceptance:
  criteria:
    - id: A1
      text: quality workflow 显式绑定 JDK 21 与 Maven 缓存，调用 scripts/ci/preflight.py --strict，避免 runner 默认 JDK8 误判
    - id: A2
      text: workflow 覆盖 contract、全量 Maven test、架构/格式/secret/compose 相关门禁，并把长日志与结构化摘要作为 artifact 保存
    - id: A3
      text: 失败步骤能明确定位到命令和证据文件；不把 secrets、原始 prompt 或生产数据写入日志/artifact
    - id: A4
      text: README 记录 CI job、JDK/Node/Docker 前置条件、失败排查和本地等价命令；只修改本卡 ownership 文件
    - id: A5
      text: workflow YAML 语法/静态检查通过，secret scan 与既有质量门禁不回归

budget:
  token_limit: 2000

tests:
  must_run:
    - name: workflow static inspection
      command: python -c "from pathlib import Path; t=Path('.github/workflows/quality.yml').read_text(encoding='utf-8'); required=['actions/setup-java','java-version','preflight.py','--strict']; assert all(x in t for x in required)"
      expected: workflow 包含 JDK setup、preflight strict 与必要质量门禁
    - name: secret scan
      command: python scripts/ci/secret_scan.py
      expected: 通过
    - name: preflight unit tests
      command: python -m unittest scripts.ci.test_preflight -v
      expected: 通过
  evidence_file: tests/evidence/P7Q-02-worker-summary.v1.json
  evidence_schema:
    summary:
      total: 0
      passed: 0
      failed: 0
      failed_cases: []
      duration_ms: 0
    raw_output_stored: true

