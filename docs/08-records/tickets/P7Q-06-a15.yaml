acceptance:
  criteria:
    - id: A1
      text: 引入轻量 URL Router（不新增依赖也可），所有顶层工作台/工具/管理/个人空间视图及 Control section 有稳定可分享 URL；spaceId、provenance context、run/conversation 等页面状态按需编码，刷新后恢复同一页面与空间边界
    - id: A2
      text: 所有用户可见列表不再硬截断（禁止 slice(0, 5) 与 limit=100 作为终点）；对支持 cursor 的 sources/jobs/indexes/conversations/runs 及管理列表实现 nextCursor 加载或明确分页控件，space_id 始终来自当前路由/选择并传入 API
    - id: A3
      text: >100 个资源、>5 个任务/索引的合成 fixture 可通过分页访问完整集合；每次切换空间/筛选条件清除旧 cursor，加载/空态/错误态与上一页/下一页行为明确
    - id: A4
      text: Playwright 至少覆盖五个刷新恢复页面与一条 >100 sources 分页旅程；Vitest/类型检查覆盖路由编码、cursor 状态和列表分页边界；现有 8 条关键旅程不得回退
    - id: A5
      text: 不修改后端契约/迁移/生产配置，不新增第三方依赖；Web format/build、unit、e2e、secret scan 通过；不得把分页问题用前端 slice 隐藏

budget:
  token_limit: 11000

tests:
  must_run:
    - name: web format
      command: npm --prefix apps/web run format:check
      expected: TypeScript 无错误
    - name: web unit
      command: npm --prefix apps/web run test:unit
      expected: 现有与新增单测全部通过
    - name: web e2e
      command: npm --prefix apps/web run test:e2e
      expected: 现有 8 条旅程加刷新恢复/大列表分页通过
    - name: web build
      command: npm --prefix apps/web run build
      expected: build 成功
    - name: hard truncation scan
      command: rg -n 'slice\(0,\s*5\)|limit=100|limit%3D100' apps/web/src apps/web/tests
      expected: 无生产代码硬截断；若命中测试 fixture 必须说明不是实现绕过
    - name: secret scan
      command: python scripts/ci/secret_scan.py
      expected: passed
  evidence_file: tests/evidence/P7Q-06-worker-summary.v1.json
