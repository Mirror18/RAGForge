acceptance:
  criteria:
    - id: A1
      text: 文档列表、Revision/Chunk 列表、来源任务或引用均可在普通路径跳转到 Chunk Studio 或 Retrieval Playground，不要求用户手填 childChunkId、contentRef、hash、index/profile UUID/version
    - id: A2
      text: 新增 lookup API 必须包含并强制 space_id，服务端对目标资源重新授权；跨空间、无权访问或无效上下文不得泄露资源内容，返回明确的 403/404 路径
    - id: A3
      text: 跳转上下文编码进 URL/query 或等价可恢复状态，Studio/Playground 刷新后仍恢复当前上下文；生产 UI 不渲染或提交 queryVector
    - id: A4
      text: Citation/检索命中使用结构化 provenance 生成跳转参数，来源预览仍经过既有授权链路，不以自由文本拼接 citation 或绕过授权
    - id: A5
      text: OpenAPI 与实现一致，contract 52/52；新增 lookup 单元/集成路径至少覆盖成功、跨空间或未授权、无效上下文 3/3

