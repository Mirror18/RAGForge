    - id: A1
      text: ADR-0012 记录选型、空间/索引作用域、重建与回滚方案，状态为 Accepted；不得接受需要用户审批的新高风险决策。
    - id: A2
      text: 替换生产路径中的 InMemoryBm25CandidateStore；lexical 状态可从持久化事实重建，服务重启后仍可命中。
    - id: A3
      text: Provider/Store 明确包含 space_id 与 index/version 作用域，跨空间数据不会进入同一 lexical 查询结果。
    - id: A4
      text: 新增重启后 lexical index 命中集成测试，并保留 RetrievalServiceTest 与 worker 构建路径测试。
    - id: A5
      text: R-023 在本卡报告中标记为可关闭并给出验证证据；若实现确实需要数据库迁移，停止并向 Orchestrator 提出精确迁移方案，不自行新增 V21。

