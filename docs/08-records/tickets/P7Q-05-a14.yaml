acceptance:
  criteria:
    - id: A1
      text: 检测 git diff 中涉及 retrieval/answer/prompt/chunk/embedding/rerank/parser（大小写不敏感、路径边界明确）的文件；命中时不可自动 waiver，必须运行既有 phase6 evaluation_runner 的 128-case synthetic baseline/candidate 评估并输出结构化报告
    - id: A2
      text: 未命中 RAG 变更时明确输出 skipped 且 exit 0；命中但评估失败、报告未达阈值或输入异常时 exit 非 0，不能静默跳过
    - id: A3
      text: baseline/candidate 对比报告包含 code commit、dataset/config 版本与 hash、seed、阈值、切片与安全指标，并写入 tests/evidence/phase7-evaluation-*.v1.json；不添加 Promptfoo 或其他第三方依赖
    - id: A4
      text: 新增单测覆盖命中、未命中、评估失败阻断、临时合成变更触发四类路径；CI 在静态/契约检查之后接入 gate，并能在 pull_request 与 push 场景得到稳定 base ref
    - id: A5
      text: 保持 cloud egress disabled、公开合成数据与现有评估 runner 为唯一真相源；不修改 Phase 6 数据集/runner，不新增迁移或生产配置

budget:
  token_limit: 5000

tests:
  must_run:
    - name: gate unit tests
      command: python -m unittest tests.ci.test_rag_evaluation_gate -v
      expected: 命中/跳过/失败阻断/合成变更触发全部通过
    - name: phase6 runner regression
      command: python -m unittest scripts/phase6/evaluation_runner_test.py
      expected: 7/7
    - name: synthetic evaluation gate
      command: python scripts/ci/rag_evaluation_gate.py --base-ref HEAD~1 --head-ref HEAD --output tests/evidence/phase7-evaluation-worker.v1.json
      expected: 当前无 RAG 路径变更时 skipped；使用测试 fixture 时命中并生成 128-case 报告
    - name: secret scan
      command: python scripts/ci/secret_scan.py
      expected: passed
    - name: workflow static check
      command: python -c "from pathlib import Path; t=Path('.github/workflows/quality.yml').read_text(encoding='utf-8'); assert 'rag_evaluation_gate.py' in t and 'phase7-evaluation-' in t"
      expected: CI 已接入评估 gate 与 artifact
  evidence_file: tests/evidence/P7Q-05-worker-summary.v1.json
  evidence_schema:
    summary:
      total: 0
      passed: 0
      failed: 0
      failed_cases: []
      duration_ms: 0
    raw_output_stored: true

