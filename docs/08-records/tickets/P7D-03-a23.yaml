objective:
  text: 在一次全新、无历史卷数据的 Ubuntu 24.04 环境中，按部署文档启动 RAGForge 并完成十条合成数据业务旅程，输出可审计的结构化证据；验证失败必须 fail-closed，不得用既有 Windows/共享 Compose 资源替代干净 Ubuntu 验收。
  journeys:
    - clean bootstrap and platform admin setup with disposable secret
    - provider test and explicit LOCAL_ONLY route
    - space creation and member role assignment
    - Git and Markdown/file ingestion with job completion
    - active index readiness and provenance-preserving retrieval
    - streaming answer with structured citation references
    - feedback persistence and audit event verification
    - cross-space access rejection
    - unauthorized CLOUD egress rejection
    - restart/reconnect and RPO 0s event/data consistency check
acceptance:
  - id: A1
    text: Ubuntu 24.04 clean-environment preflight, Docker/Compose versions, project/network/volume isolation and no inherited application data are evidenced.
  - id: A2
    text: Deployment follows docs/05-operations/DEPLOYMENT.md and uses immutable application/infrastructure image references with no production credentials.
  - id: A3
    text: All ten journeys pass with synthetic fixtures; every API request is space-scoped where applicable and citations retain document/chunk provenance.
  - id: A4
    text: Restart/reconnect, audit, cross-space denial and unauthorized cloud-egress denial are recorded as structured assertions, not prose-only claims.
  - id: A5
    text: Failure paths leave the disposable environment recoverable and evidence names exact commands, timestamps, commit/image digests and unresolved risks.
tests:
  preflight:
    - name: Ubuntu 24.04 availability
      command: wsl --list --verbose
      expected: an independent Ubuntu 24.04 distribution is installed and running; docker-desktop alone is insufficient
    - name: Docker engine
      command: docker info
      expected: Docker Engine is reachable from the Ubuntu environment
  must_run:
    - name: Compose isolation validation
      command: python scripts/ci/validate_compose.py --project-name ragforge-p7d03-a23 --env-file deploy/compose/env.example
      expected: exit 0 with derived project/network/volume/ports
    - name: Clean deployment
      command: python scripts/dev/core.py --project-name ragforge-p7d03-a23 --env-file deploy/compose/env.example --profile app up --build
      expected: disposable core/app stack starts on Ubuntu 24.04 with no inherited volumes
    - name: Health and runtime inspection
      command: python scripts/dev/core.py --project-name ragforge-p7d03-a23 --profile app health; python scripts/dev/core.py --project-name ragforge-p7d03-a23 --profile app ps
      expected: core and app services healthy, non-root and immutable image refs visible
    - name: Ten-journey E2E
      command: python tests/e2e/phase7_ubuntu_smoke.py --project-name ragforge-p7d03-a23 --output tests/evidence/phase7-ubuntu-smoke.v1.json
      expected: all ten journeys pass with structured assertions
    - name: Disposable teardown
      command: python scripts/dev/core.py --project-name ragforge-p7d03-a23 --profile app down
      expected: containers stop cleanly and evidence records retained without deleting unrelated projects
  evidence_file: tests/evidence/phase7-ubuntu-smoke.v1.json
