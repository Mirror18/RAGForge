acceptance:
  criteria:
    - id: A1
      text: UI 明确区分 BUILDING/VALIDATING/READY candidate、ACTIVE active、RETIRED retired，不把 candidate 文案写成 active。
    - id: A2
      text: 展示构建/验证依据，READY candidate 可发布，active 显示当前指针与 previous pointer。
    - id: A3
      text: 支持回滚上一版并展示回滚后的 active/previous 指针；至少两个索引版本可正确切换。
    - id: A4
      text: 若现有 API 不足，仅在 index ownership 内补齐 space_id 强制、幂等/乐观锁保护的 rollback/retire 端点，并同步 OpenAPI。
    - id: A5
      text: Web format:check/build、契约测试与索引定向测试通过；不修改 P7C-02 新增来源/任务组件。

