acceptance:
  criteria:
    - id: A1
      text: 增加受权管理聚合 API：aggregate health、当前 space 的 cost/usage、feedback list、audit export；每个查询强制 space_id，不能返回 prompt、正文、密钥或原始敏感 payload
    - id: A2
      text: 管理 API 只允许平台管理员或被授权的管理角色；普通 VIEWER/成员不能读取聚合管理视图；跨空间、未授权与停用用户均有拒绝路径
    - id: A3
      text: 聚合结果使用分页/时间窗与稳定排序，不使用 limit=100 或 slice(0,5) 硬截断；audit export 输出脱敏结构化记录并保留 correlation/provenance 标识
    - id: A4
      text: Control Center 提供 health、cost、feedback、audit 四个子视图，替代仅展示 actuator/raw Phase6OperationsService 链接；异常有清晰权限/相关 ID 提示
    - id: A5
      text: OpenAPI 与实现一致，contract 52/52；新增权限集成 4/4 与聚合查询单元 4/4；不新增数据库迁移

