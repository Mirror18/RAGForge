acceptance:
  criteria:
    - id: A1
      text: 新增 /sources、/jobs、/indexes 的分页与筛选 API；使用 cursor 分页，不使用 slice(0,5) 或 limit=100 硬截断。
    - id: A2
      text: 重试、重放、重新同步、归档、删除均包含幂等 Key、乐观锁与 space_id 强制校验。
    - id: A3
      text: OpenAPI 覆盖新增 operation，contract_test.py 通过 52/52。
    - id: A4
      text: 跨空间、未授权、停用用户三类拒绝路径均有 ServerIntegrationTest 用例。
    - id: A5
      text: 迁移只能追加 V21，包含锁/回填说明，不修改 V19/V20，不与其他卡片冲突。

