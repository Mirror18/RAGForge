acceptance:
  criteria:
    - id: A1
      text: quality checkout 保证 push 事件的 github.event.before 与 github.sha 均可被 git rev-parse 和 git diff 解析
    - id: A2
      text: pull_request base/head 同样可解析，不依赖仅存在于本地 clone 的偶然历史
    - id: A3
      text: RAG gate 对 bad object 继续失败，不改为 skipped 或静默放行
    - id: A4
      text: workflow YAML、format、secret scan 通过；不修改 workflow 之外的生产代码
    - id: A5
      text: 说明对 checkout 时间/仓库体积的影响与回滚方式

