apiVersion: 1

datasources:
  - name: Prometheus
    uid: ragforge-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: ragforge-tempo
  - name: Loki
    uid: ragforge-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: 'trace_id=([a-f0-9]{32})'
          url: '$${__value.raw}'
          datasourceUid: ragforge-tempo
  - name: Tempo
    uid: ragforge-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: ragforge-loki
        spanStartTimeShift: '-2s'
        spanEndTimeShift: '2s'
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: ragforge-prometheus
