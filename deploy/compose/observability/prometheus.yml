global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: ragforge

rule_files:
  - /etc/prometheus/rules/phase6.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889

  # The server and worker are intentionally host targets: the core Compose
  # baseline does not yet package application images. A target being down is
  # visible as an alert; it is not silently treated as healthy.
  - job_name: ragforge-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: ragforge-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
