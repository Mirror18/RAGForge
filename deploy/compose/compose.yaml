name: ${COMPOSE_PROJECT_NAME:-ragforge-p1}

# Provider connection contract consumed by application containers when they are
# added. The default is host-managed Ollama; cloud routes remain opt-in.
x-ragforge-provider:
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

# Runtime hardening is intentionally explicit on each application service so
# the rendered Compose model and docker inspect output remain auditable.
x-ragforge-app-hardening: &ragforge-app-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  cpus: 1.0
  mem_limit: 768m
  pids_limit: 256
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# Core infrastructure is always available. The optional app profile adds the
# server, ingestion worker and static web container from the unified Dockerfile.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.4-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragforge}
      POSTGRES_USER: ${POSTGRES_USER:-ragforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - core
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.11.5}
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "${QDRANT_PORT:-26333}:6333"
      - "${QDRANT_GRPC_PORT:-26334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - core
    healthcheck:
      # The pinned Qdrant image has bash but does not ship curl/wget.
      # Use bash's TCP socket support; host-side health_probe.py still checks /readyz.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management-alpine}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ragforge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    ports:
      - "${RABBITMQ_PORT:-25672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-25673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - core
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8.0.1-alpine}
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-change-me}
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$${VALKEY_PASSWORD}"
    ports:
      - "${VALKEY_PORT:-26379}:6379"
    volumes:
      - valkey-data:/data
    networks:
      - core
    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli -a "$${VALKEY_PASSWORD}" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ragforge}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-minio-secret}
    command: server /data --console-address ":9001"
    ports:
      - "${S3_PORT:-29000}:9000"
      - "${S3_CONSOLE_PORT:-29001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - core
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9000/minio/health/ready >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Ollama is normally managed by the developer host. The optional profile is
  # useful for a fully containerized smoke environment; application services
  # should consume OLLAMA_BASE_URL instead of assuming a local socket.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.5.4}
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-21434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - core
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:11434/api/tags >/dev/null
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  server:
    <<: *ragforge-app-hardening
    image: ${RAGFORGE_SERVER_IMAGE:-ragforge/server:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: server
    profiles:
      - app
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ragforge}
      JDBC_DATABASE_USERNAME: ${POSTGRES_USER:-ragforge}
      JDBC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      VALKEY_URL: redis://:${VALKEY_PASSWORD:-change-me}@valkey:6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-ragforge}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-me}
      RAGFORGE_RABBIT_HEALTH_ENABLED: "true"
      RAGFORGE_OBJECT_STORAGE_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ragforge}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-ragforge}
      S3_PREFIX: ${S3_PREFIX:-phase3}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-change-me}
      RAGFORGE_OUTBOX_RELAY_ENABLED: "true"
      RAGFORGE_RUN_EVENT_FANOUT_ENABLED: "true"
      RAGFORGE_PHASE6_OPERATIONS_ENABLED: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    ports:
      - "${APP_SERVER_PORT:-25082}:8080"
    networks:
      - core
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/actuator/health | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *ragforge-app-hardening
    image: ${RAGFORGE_WORKER_IMAGE:-ragforge/ingestion-worker:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    profiles:
      - app
    restart: unless-stopped
    environment:
      RAGFORGE_INGESTION_ENABLED: "true"
      RAGFORGE_RABBITMQ_HOST: rabbitmq
      RAGFORGE_RABBITMQ_PORT: 5672
      RAGFORGE_RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-ragforge}
      RAGFORGE_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-me}
      JDBC_DATABASE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-ragforge}
      JDBC_DATABASE_USERNAME: ${POSTGRES_USER:-ragforge}
      JDBC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ragforge}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-ragforge}
      S3_PREFIX: ${S3_PREFIX:-phase3}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-change-me}
      OLLAMA_ENDPOINT: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
    networks:
      - core
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # The worker is a non-HTTP process. PID 1 is the Spring worker itself;
      # its liveness is the readiness signal after all dependencies are ready.
      test:
        - CMD-SHELL
        - kill -0 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    <<: *ragforge-app-hardening
    image: ${RAGFORGE_WEB_IMAGE:-ragforge/web:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: web
    profiles:
      - app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-25174}:8080"
    mem_limit: 128m
    pids_limit: 128
    stop_grace_period: 10s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=0755
      - /var/log/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0755
    networks:
      - core
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  core:
    name: ${RAGFORGE_NETWORK_NAME:-ragforge-p1-core}
    driver: bridge

volumes:
  postgres-data:
    name: ${RAGFORGE_VOLUME_PREFIX:-ragforge-p1}_postgres-data
  qdrant-data:
    name: ${RAGFORGE_VOLUME_PREFIX:-ragforge-p1}_qdrant-data
  rabbitmq-data:
    name: ${RAGFORGE_VOLUME_PREFIX:-ragforge-p1}_rabbitmq-data
  valkey-data:
    name: ${RAGFORGE_VOLUME_PREFIX:-ragforge-p1}_valkey-data
  minio-data:
    name: ${RAGFORGE_VOLUME_PREFIX:-ragforge-p1}_minio-data
  ollama-data:
    name: ${RAGFORGE_VOLUME_PREFIX:-ragforge-p1}_ollama-data
