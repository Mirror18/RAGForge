name: ${COMPOSE_PROJECT_NAME:-ragforge-p1}

# This file is an overlay. Always use it together with compose.yaml so that
# the observability services join the isolated core network and project.
services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.111.0}
    profiles:
      - observability
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${OTEL_GRPC_PORT:-24317}:4317"
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${OTEL_HTTP_PORT:-24318}:4318"
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${OTEL_METRICS_PORT:-28889}:8889"
    networks:
      - core
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yml:/etc/prometheus/rules/phase6.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-29090}:9090"
    networks:
      - core
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.2}
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be supplied outside Git}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:23000}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-23000}:3000"
    networks:
      - core
    restart: unless-stopped

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.2.1}
    profiles:
      - observability
    command:
      - -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-23100}:3100"
    networks:
      - core
    restart: unless-stopped

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.6.1}
    profiles:
      - observability
    command:
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${TEMPO_PORT:-23200}:3200"
    networks:
      - core
    restart: unless-stopped

volumes:
  prometheus-data:
    name: ${RAGFORGE_OBSERVABILITY_VOLUME_PREFIX:-ragforge-p1}_prometheus-data
  grafana-data:
    name: ${RAGFORGE_OBSERVABILITY_VOLUME_PREFIX:-ragforge-p1}_grafana-data
  loki-data:
    name: ${RAGFORGE_OBSERVABILITY_VOLUME_PREFIX:-ragforge-p1}_loki-data
  tempo-data:
    name: ${RAGFORGE_OBSERVABILITY_VOLUME_PREFIX:-ragforge-p1}_tempo-data
