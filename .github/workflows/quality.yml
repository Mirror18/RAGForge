name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static and contract quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run CI preflight --strict
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/evidence/ci-logs
          python scripts/ci/preflight.py --json --strict 2>&1 | tee tests/evidence/ci-logs/preflight.json

      - name: Check formatting and syntax
        run: python scripts/ci/format_check.py

      - name: Validate Compose configuration
        run: python scripts/ci/validate_compose.py

      - name: Check modular architecture boundary
        run: python scripts/ci/architecture_check.py

      - name: Check canonical path indexes
        run: python scripts/ci/path_index_check.py

      - name: Check Markdown links
        run: python scripts/ci/check_markdown_links.py

      - name: Test Markdown traversal boundaries
        run: python -m unittest discover -s scripts/ci -p "test_*.py" -v

      - name: Scan tracked files for secrets
        run: python scripts/ci/secret_scan.py

      - name: Run deterministic Phase 0 tests
        run: python -m unittest discover -s scripts/phase0 -p "test_*.py" -v

      - name: Run contract test seam
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/evidence/ci-logs
          python scripts/ci/contract_test.py 2>&1 | tee tests/evidence/ci-logs/contract-test.log

      - name: Run contract unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/evidence/ci-logs
          set +e
          python -m unittest discover -s tests/contract -p "test_*.py" -v 2>&1 | tee tests/evidence/ci-logs/contract-unit.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -eq 5 ]] && ! compgen -G "tests/contract/test_*.py" >/dev/null; then
            echo "::notice title=Contract tests::tests/contract is empty in the current scaffold; exit 5 is treated as an explicit placeholder."
            exit 0
          fi
          exit "$status"

      - name: Check OpenAPI and controller coverage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/evidence/ci-logs
          set +e
          # coverage_test.py is the strict bidirectional contract gate.
          python -m unittest tests.contract.coverage_test -v 2>&1 | tee tests/evidence/ci-logs/coverage_test.log
          unit_status=${PIPESTATUS[0]}
          python scripts/ci/contract_coverage.py --output tests/evidence/ci-logs/contract-coverage.json 2>&1 | tee tests/evidence/ci-logs/contract-coverage.log
          coverage_status=${PIPESTATUS[0]}
          if [[ "$unit_status" -ne 0 || "$coverage_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload contract coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-contract-coverage-${{ github.run_id }}
          path: tests/evidence/ci-logs/contract-coverage.json
          if-no-files-found: error

      - name: Run RAG evaluation gate for RAG-relevant changes
        shell: bash
        env:
          RAG_GATE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RAG_GATE_HEAD_REF: ${{ github.sha }}
        run: |
          set -o pipefail
          mkdir -p tests/evidence
          python scripts/ci/rag_evaluation_gate.py \
            --base-ref "$RAG_GATE_BASE_REF" \
            --head-ref "$RAG_GATE_HEAD_REF" \
            --output tests/evidence/phase7-evaluation-${{ github.run_id }}.v1.json

      - name: Upload Phase 7 RAG evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-phase7-evaluation-${{ github.run_id }}
          path: tests/evidence/phase7-evaluation-*.v1.json
          if-no-files-found: error

      - name: Run deterministic Phase 2 cloud, concurrency, and egress gates
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/evidence/ci-logs
          {
            python -m unittest discover -s tests/integration -p "test_phase2_cloud_*.py" -v
            python -m unittest discover -s tests/performance -p "test_phase2_*.py" -v
            python -m unittest discover -s tests/security -p "test_phase2_*.py" -v
          } 2>&1 | tee tests/evidence/ci-logs/phase2-gates.log

      - name: Check dependency manifest and lockfile inventory
        run: python scripts/ci/dependency_inventory.py --require-lockfiles

      - name: Generate SBOM with Syft action
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: ragforge-sbom-cyclonedx
          upload-artifact: false

      - name: Publish SBOM job artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Scan repository dependencies with Grype action
        uses: anchore/scan-action@v6
        id: scan
        with:
          path: "."
          fail-build: true
          severity-cutoff: high

      - name: Upload Grype SARIF evidence
        if: always() && steps.scan.outputs.sarif != ''
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-grype-sarif
          path: ${{ steps.scan.outputs.sarif }}
          if-no-files-found: error

      - name: Verify local SBOM/dependency command seam
        run: python scripts/ci/sbom_dependency_scan.py --mode auto

      - name: Install Tesseract OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Maven compile on JDK 21
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/evidence/ci-logs
          mvn --batch-mode --no-transfer-progress -DskipTests compile 2>&1 | tee tests/evidence/ci-logs/maven-compile.log

      - name: Full Maven unit and architecture regression on JDK 21
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/evidence/ci-logs
          mvn --batch-mode --no-transfer-progress test 2>&1 | tee tests/evidence/ci-logs/maven-test.log

      - name: Run Phase 5 generation evaluation
        run: python scripts/phase5/generation_evaluation.py

      - name: Generate Phase 5 performance evidence
        run: python scripts/phase5/performance_evidence.py

      - name: Run Phase 5 security and egress gates when Maven exists
        if: ${{ hashFiles('**/pom.xml') != '' }}
        run: python scripts/phase5/security_evaluation.py

      - name: Upload Phase 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-phase5-evidence
          path: |
            tests/evidence/phase5-generation-evaluation.json
            tests/evidence/phase5-performance.json
            tests/evidence/phase5-security.json
          if-no-files-found: error

      - name: Run Phase 3 cross-platform and parser acceptance gates
        if: ${{ hashFiles('**/pom.xml') != '' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/evidence/ci-logs
          {
            python -m unittest discover -s tests/acceptance -p "test_phase3_*.py" -v
            python -m unittest discover -s tests/security -p "test_phase3_fault_*.py" -v
            python -m unittest discover -s tests/performance -p "test_phase3_*.py" -v
          } 2>&1 | tee tests/evidence/ci-logs/phase3-gates.log

      - name: Run deterministic Phase 4 retrieval quality and reference-scale gates
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/evidence/ci-logs
          {
            python -m unittest discover -s scripts/phase4 -p "test_*.py" -v
            python scripts/phase4/retrieval_benchmark.py
          } 2>&1 | tee tests/evidence/ci-logs/phase4-retrieval.log

      - name: Upload Phase 4 retrieval evidence
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-phase4-retrieval-evidence
          path: tests/evidence/phase4-retrieval-benchmark.json
          if-no-files-found: error

      - name: Upload Phase 3 JVM evidence
        if: always() && hashFiles('**/target/surefire-reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-phase3-jvm-evidence
          path: |
            apps/server/target/surefire-reports/**
            apps/ingestion-worker/target/surefire-reports/**
          if-no-files-found: error

      - name: Cache apps/web npm dependencies
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json', 'apps/web/package.json') }}
          restore-keys: |
            npm-web-${{ runner.os }}-

      - name: Install apps/web dependencies from lockfile
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        working-directory: apps/web
        run: npm ci

      - name: npm format/build when apps/web exists
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../tests/evidence/ci-logs
          {
            npm run --if-present format:check
            npm run --if-present build
          } 2>&1 | tee ../../tests/evidence/ci-logs/npm-build.log

      - name: npm unit tests when apps/web exists
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../tests/evidence/ci-logs
          npm run --if-present test 2>&1 | tee ../../tests/evidence/ci-logs/npm-test.log

      - name: Write quality run summary
        if: always()
        shell: bash
        env:
          QUALITY_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p tests/evidence/ci-logs
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = {
              "schema_version": "P7Q-02.v1",
              "job_status": os.environ["QUALITY_JOB_STATUS"],
              "jdk": "21",
              "node": "22",
              "evidence": [
                  "preflight.json",
                  "contract-test.log",
                  "contract-unit.log",
                  "maven-compile.log",
                  "maven-test.log",
                  "phase2-gates.log",
                  "phase3-gates.log",
                  "phase4-retrieval.log",
                  "npm-build.log",
                  "npm-test.log",
              ],
          }
          Path("tests/evidence/ci-logs/quality-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload quality logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-quality-logs-${{ github.run_id }}
          path: |
            tests/evidence/ci-logs/**
            apps/server/target/surefire-reports/**
            apps/ingestion-worker/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14
