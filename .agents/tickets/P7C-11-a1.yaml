  must_run:
    - name: Health probe unit tests
      command: python -m unittest discover -s scripts/ops -p "test_health_probe.py"
      expected: "所有测试通过"
    - name: Health probe CLI help
      command: python scripts/ops/health_probe.py --help
      expected: "包含 --check-ollama"
    - name: Core health CLI help
      command: python scripts/dev/core.py health --help
      expected: "包含 --check-ollama"
    - name: Diff whitespace check
      command: git diff --check
