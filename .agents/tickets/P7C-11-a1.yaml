acceptance:
  criteria:
    - id: A1
      text: 直接运行 health_probe.py 默认不把 Ollama 作为失败条件，仍检查 PostgreSQL、Qdrant、RabbitMQ、Valkey 和 MinIO
    - id: A2
      text: health_probe.py 支持 --check-ollama；scripts/dev/core.py 支持 health --check-ollama 并正确透传
    - id: A3
      text: 默认成功文案说明只验证必需 core 服务，文档明确 Ollama 仅在本地模型场景显式检查
    - id: A4
      text: 单元测试、CLI 帮助检查和 git diff --check 全部通过

