acceptance:
  criteria:
    A1: 业务向导中的资料列表和任务列表均改为表格/数据列表，每页固定显示不超过 10 条，支持上一页、下一页和当前页状态。
    A2: 带引用回答页面的会话历史和展开后的运行记录均按每页 10 条展示，切换会话或刷新后分页状态不产生跨空间或错误数据。
    A3: 空状态、首尾页、加载中、分页禁用和错误状态均有清晰中文反馈；历史回答仍可点击恢复，归档会话保持只读。
    A4: 不改变现有 API、space_id 隔离、结构化 citation/provenance、角色权限和云端出境语义。
    A5: 浏览器回归覆盖至少 10 条以上合成列表的分页边界、问答历史分页与恢复，并记录证据。
