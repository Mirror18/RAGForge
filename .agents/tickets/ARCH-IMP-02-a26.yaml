acceptance:
  criteria:
    A1: 质量结果是不可变、space-scoped 的记录，绑定 index、ArtifactManifest 集合 hash 与策略版本。
    A2: V24 为 append-only migration；所有查询和外键包含 space_id；不保存正文或凭据。
    A3: Shadow PASS/FAIL 都会记录，质量失败不得改变 READY、active pointer 或 publish 行为。
    A4: 同 index 重投幂等、跨空间拒绝、影子 PASS/FAIL 均有测试。
    A5: 不修改检索算法、质量阈值启用策略或生产数据。
