acceptance:
  criteria:
    A1: 主导航、页面标题、操作按钮和常见状态均以简体中文为主；保留的 API 标识、模型名和哈希只作为可折叠的技术详情。
    A2: 业务闭环主页面明确显示“选择空间→导入知识→发布索引→开始问答”的当前步骤、下一步动作和完成条件；重复的来源库与任务中心入口收纳为可选高级管理。
    A3: 配置中心将 Provider、模型路由、Prompt 等术语提供中文解释；业务向导优先复用服务端已发布资源，不要求普通用户手填 UUID、hash 或 JSON。
    A4: 不改变 API、space_id 隔离、云端出境显式授权、结构化 provenance/citation 或现有角色权限语义。
    A5: 真实或合成浏览器闭环完成登录、空间、导入、摄取、索引发布、问答、引用和运行追踪，并生成截图写入业务演示文档；文档明确数据来源和验证边界。
tests:
  must_run:
