acceptance:
  criteria:
    A1: 索引生命周期版本改为可横向滚动的数据列表，每页固定显示不超过 10 条，并显示当前页、总页数和总条数。
    A2: 当前版本/上一版本指针摘要保留；待发布版本仍可发布，当前版本仍可按既有权限回滚或退役。
    A3: 状态、验证结果、构建依据、配置版本、空状态、加载动作和操作按钮均有清晰中文展示，移动端不破坏可读性。
    A4: 不改变现有 API、space_id 隔离、索引 candidate/active/retired 语义、权限判断和发布/回滚/退役行为。
    A5: 浏览器回归覆盖至少 16 条合成索引版本的第一页、第二页和生命周期操作入口，并记录证据。
