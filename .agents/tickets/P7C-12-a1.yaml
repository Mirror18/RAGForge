acceptance:
  criteria:
    - id: A1
      text: start-local.ps1 启动 Server 和 Worker 时显式禁用 Maven 增量编译，避免 stale target/classes 遗漏源码类
    - id: A2
      text: 完整启动后 Server、Worker、Web 保持运行，Server 健康端点为 200，core 依赖不受影响
    - id: A3
      text: 未登录访问 /api/v1/sessions/current 返回结构化 401，而不是 NoClassDefFoundError/500；前端可正常进入登录态
    - id: A4
      text: PowerShell 参数静态检查、Maven 编译验证、登录接口验证和 git diff --check 全部通过

budget:
  token_limit: 5000

tests:
  must_run:
    - name: Maven server compile
      command: $env:JAVA_HOME='C:\\Program Files\\Java\\jdk-21'; $env:Path="$env:JAVA_HOME\\bin;$env:Path"; mvn -q -pl backend/server -am compile '-Dmaven.compiler.useIncrementalCompilation=false'
      expected: "exit 0"
    - name: Startup option static check
      command: rg -n "maven.compiler.useIncrementalCompilation=false" scripts/dev/start-local.ps1
      expected: "Server 和 Worker 启动参数均包含该选项"
    - name: Session unauthorized response
      command: curl.exe -sS -i http://127.0.0.1:25082/api/v1/sessions/current
      expected: "HTTP 401 且 Content-Type 为 application/problem+json"
    - name: Diff whitespace check
      command: git diff --check
      expected: "exit 0"
  evidence_file: tests/evidence/P7C-12-worker-summary.v1.json
  evidence_schema:
    summary:
      total: 0
      passed: 0
      failed: 0
      failed_cases: []
      duration_ms: 0
    raw_output_stored: false

