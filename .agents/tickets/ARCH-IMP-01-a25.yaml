acceptance:
  criteria:
    A1: ArtifactManifest 是不可变、space-scoped 的契约与持久化记录，绑定 revision、pipeline/parser 版本、父 artifact、content hash、受控 object reference 和位置映射版本。
    A2: V23 为 append-only migration；所有查询和外键携带 space_id；manifest 不保存正文、credential 或客户端路径。
    A3: Worker 写入 manifest 时复用服务端生成的 artifact identity；相同 space/revision/pipeline/parser/content hash 的重投幂等，不同输入不得覆盖既有 manifest。
    A4: Server persistence 和 Worker 单元/集成测试覆盖同空间幂等、跨空间拒绝和 hash 不一致拒绝；本卡不改变 active pointer、candidate validation、chunking 或发布行为。
    A5: Schema、migration 和现有实现保持兼容；未声明执行 RetrievalExecutionSnapshot、质量阈值或任何生产数据迁移。
tests:
