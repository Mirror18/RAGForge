acceptance:
  criteria:
    - id: A1
      text: start-local.ps1 启动 Server 和 Worker 时显式固定 Maven Java 21 编译参数，并关闭增量编译，避免全局 Maven profile 生成坏 class
    - id: A2
      text: 完整启动后 Server、Worker、Web 保持运行，Worker 完成 Spring Boot 启动日志后脚本才报告就绪
    - id: A3
      text: Worker 编译与启动使用本地 MinIO/RabbitMQ 配置，启动失败时返回非零并输出最近日志，不再静默报告成功
    - id: A4
      text: PowerShell 解析、Server/Worker Maven 编译、完整本地启动、HTTP 健康检查和 git diff --check 全部通过

budget:
  token_limit: 5000

tests:
  must_run:
    - name: Maven server compile
      command: $env:JAVA_HOME='C:\\Program Files\\Java\\jdk-21'; $env:Path="$env:JAVA_HOME\\bin;$env:Path"; mvn -q -pl backend/server -am clean compile '-Dmaven.compiler.release=21' '-Dmaven.compiler.source=21' '-Dmaven.compiler.target=21' '-Dmaven.compiler.compilerVersion=21' '-Dmaven.compiler.useIncrementalCompilation=false'
      expected: "exit 0"
    - name: Maven worker compile
      command: $env:JAVA_HOME='C:\\Program Files\\Java\\jdk-21'; $env:Path="$env:JAVA_HOME\\bin;$env:Path"; mvn -q -pl backend/ingestion-worker -am clean compile '-Dmaven.compiler.release=21' '-Dmaven.compiler.source=21' '-Dmaven.compiler.target=21' '-Dmaven.compiler.compilerVersion=21' '-Dmaven.compiler.useIncrementalCompilation=false'
      expected: "exit 0"
    - name: Startup parameter static check
      command: rg -n "maven.compiler.(release|source|target|compilerVersion|useIncrementalCompilation)" scripts/dev/start-local.ps1
      expected: "Server 和 Worker 启动参数均固定 Java 21 且关闭增量编译"
    - name: Diff whitespace check
      command: git diff --check
      expected: "exit 0"
