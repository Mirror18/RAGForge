acceptance:
  criteria:
    - id: A1
      text: 默认执行 start-local.bat 不再检查或要求本机 Ollama，仍保持现有 core、Server、Worker、Web 启动顺序
    - id: A2
      text: 新增 -CheckOllama 显式开关，启用时检查 qwen3.5:9b 与 nomic-embed-text:latest，并在失败时给出可执行提示且不静默切换云路由
    - id: A3
      text: scripts/dev/README.md、docs/01-技术栈与工程运行.md 和 docs/05-部署运维与恢复.md 明确 Ollama 不是项目启动前置条件
    - id: A4
      text: PowerShell 语法检查、启动参数静态检查和 git diff --check 全部通过

budget:
  token_limit: 4500

tests:
  must_run:
    - name: PowerShell parse
      command: pwsh -NoProfile -Command '& { $errors = $null; [System.Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText((Resolve-Path "scripts/dev/start-local.ps1"), [Text.Encoding]::UTF8), [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { throw "PowerShell parse failed" } }'
      expected: "exit 0"
    - name: Startup option static check
      command: pwsh -NoProfile -Command '& { $content = Get-Content -Raw "scripts/dev/start-local.ps1"; if ($content -notmatch "\[switch\]\$CheckOllama") { throw "CheckOllama switch missing" }; if ($content -match "\[switch\]\$SkipModelCheck") { throw "obsolete SkipModelCheck switch remains" }; if ($content -notmatch "if \(\$CheckOllama\)") { throw "opt-in guard missing" } }'
      expected: "exit 0"
    - name: Diff whitespace check
      command: git diff --check
      expected: "exit 0"
  evidence_file: tests/evidence/P7C-10-worker-summary.v1.json
  evidence_schema:
