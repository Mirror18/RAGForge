acceptance:
  criteria:
    A1: 历史答案、citation 与派生物料读取在返回前重新核验当前 space 授权和删除状态。
    A2: 删除或撤权后不得返回正文、派生摘录或 citation preview；跨空间必须失败。
    A3: 保留现有结构化 Evidence 与 material reference，不引入文档 ACL 或新缓存。
    A4: 覆盖删除、撤权、跨空间和正常授权矩阵；完成安全评审测试。
    A5: 不修改来源/Job 重放、迁移、检索算法或发布行为。
