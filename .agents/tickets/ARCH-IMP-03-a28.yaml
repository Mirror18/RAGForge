acceptance:
  criteria:
    A1: RetrievalExecutionSnapshot 是不可变、space-scoped 的记录，固定一次执行的 index、profile、effective parameters、route 与 evidence identity。
    A2: V25 为 append-only migration；未知快照版本、跨空间引用和缺少当前授权必须 fail-closed。
    A3: Chat、Answer API 与 Retrieval Playground 共用 application port；不复制 dense/BM25/RRF/rerank 算法，不改变默认召回结果。
    A4: 三入口同输入 evidence identity、一致空间隔离和快照重放测试通过；持久化记录按执行身份幂等。
    A5: 使用合成身份运行离线 RAG evaluation gate，记录配置版本与基线比较；不得把 Python 参考实现宣称为共享 Java port。
