spring:
  application:
    name: ragforge-server
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/ragforge}
    username: ${JDBC_DATABASE_USERNAME:ragforge}
    password: ${JDBC_DATABASE_PASSWORD:ragforge}
    hikari:
      maximum-pool-size: ${JDBC_MAX_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${VALKEY_URL:redis://localhost:6379}
  rabbitmq:
    publisher-confirm-type: ${RAGFORGE_RABBITMQ_CONFIRM_TYPE:correlated}
    publisher-returns: ${RAGFORGE_RABBITMQ_PUBLISHER_RETURNS:true}
    template:
      mandatory: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      # Rabbit is an optional transport until the relay is explicitly enabled;
      # operators can override this property in deployment configuration.
      enabled: ${RAGFORGE_RABBIT_HEALTH_ENABLED:false}

app:
  session:
    cookie-name: ${SESSION_COOKIE_NAME:RAGFORGE_SESSION}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    ttl: ${SESSION_TTL:PT8H}

ragforge:
  object-storage:
    # Explicit opt-in: without this flag the Phase 5 answer graph stays fail-closed.
    enabled: ${RAGFORGE_OBJECT_STORAGE_ENABLED:false}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:ragforge}
    prefix: ${S3_PREFIX:phase3}
    max-artifact-bytes: ${S3_MAX_ARTIFACT_BYTES:50000000}
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
  outbox:
    relay:
      enabled: ${RAGFORGE_OUTBOX_RELAY_ENABLED:false}
      exchange: ${RAGFORGE_RABBITMQ_EXCHANGE:ragforge.ingestion}
      batch-size: ${RAGFORGE_OUTBOX_BATCH_SIZE:50}
      fixed-delay-ms: ${RAGFORGE_OUTBOX_RELAY_DELAY_MS:1000}
  run-events:
    retention: ${RAGFORGE_RUN_EVENT_RETENTION:PT15M}
  phase6:
    operations:
      enabled: ${RAGFORGE_PHASE6_OPERATIONS_ENABLED:false}
      cleanup:
        fixed-delay-ms: ${RAGFORGE_PHASE6_CLEANUP_DELAY_MS:3600000}
